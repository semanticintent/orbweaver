  </g>
  <g fill="#08151c" stroke="#75e5e5" stroke-width="3">
    <circle cx="1385" cy="540" r="82" filter="url(#softGlow)"/>
    <circle cx="1080" cy="540" r="50" opacity=".8"/>
    <circle cx="1690" cy="540" r="50" opacity=".8"/>
    <circle cx="1385" cy="280" r="44" opacity=".65"/>
    <circle cx="1385" cy="800" r="44" opacity=".65"/>
    <circle cx="1620" cy="305" r="36" opacity=".55"/>
    <circle cx="1630" cy="770" r="36" opacity=".55"/>
  </g>
  <g fill="#c9fbf4" font-family="Inter, SF Pro Display, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="1385" y="532" font-size="27" font-weight="650">semantic</text>
    <text x="1385" y="568" font-size="27" font-weight="650">proposal</text>
  </g>

