<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Orbweaver — Agent proposes. Human decides.</title>
  <desc id="desc">Opening title card for the Orbweaver WebMCP challenge video.</desc>
  <defs>
    <radialGradient id="glow" cx="72%" cy="50%" r="58%">
      <stop offset="0" stop-color="#123847" stop-opacity=".72"/>
      <stop offset=".42" stop-color="#071820" stop-opacity=".38"/>
      <stop offset="1" stop-color="#030a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ff3dc"/>
      <stop offset="1" stop-color="#52d7ea"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#030a10"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <g fill="none" stroke="#54d9e8" stroke-width="2" opacity=".48">
    <path d="M1130 540H1320M1450 540H1640M1385 475V330M1385 605V750"/>
