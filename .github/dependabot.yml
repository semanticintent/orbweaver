version: 2
updates:
  # npm: monthly, grouped. Security updates are separate and still open their own PRs as soon as a fix exists.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # vitest and its plugins must move together.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      dev-tooling:
        dependency-type: development
        exclude-patterns: ["vitest", "@vitest/*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
