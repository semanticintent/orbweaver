<svg xmlns="http://www.w3.org/2000/svg" class="orbweaver" viewBox="0 0 1226 120" width="1226" height="120" role="img" aria-labelledby="ow-publishing-flow-title ow-publishing-flow-description" style="--ow-canvas:#f7f9fc;--ow-surface:#ffffff;--ow-surface-raised:#ffffff;--ow-surface-muted:#eef2f8;--ow-text:#172033;--ow-text-muted:#667085;--ow-border:#d6deeb;--ow-border-strong:#aebbd0;--ow-edge:#71809a;--ow-edge-label:#475467;--ow-accent:#4f46e5;--ow-accent-soft:#e8e7ff;--ow-focus:#7c3aed;--ow-selection:#4f46e5;--ow-success:#15803d;--ow-warning:#b45309;--ow-danger:#c24152;--ow-shadow:rgba(32, 48, 76, 0.14);--ow-font:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, sans-serif;--ow-font-mono:&apos;IBM Plex Mono&apos;, &apos;SFMono-Regular&apos;, Consolas, monospace;--ow-font-size:14px;--ow-label-weight:600;--ow-node-radius:12px;--ow-group-radius:18px;--ow-edge-width:1.75px" data-theme="orbweaver-light"><title id="ow-publishing-flow-title">Declarative publishing flow</title><desc id="ow-publishing-flow-description">Source is validated, laid out, rendered, and published as a self-contained artifact.</desc><metadata class="ow-summary">Declarative publishing flow. Source is validated, laid out, rendered, and published as a self-contained artifact. 5 nodes and 4 relationships. Declarative source flow Validate intent. Validate intent flow Derive layout. Derive layout flow Render artifact. Render artifact flow Self-contained artifact.</metadata><defs><filter id="ow-publishing-flow-shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="var(--ow-shadow)"/></filter><marker id="ow-publishing-flow-arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ow-edge)"/></marker><marker id="ow-publishing-flow-arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 10 0 L 0 5 L 10 10 z" fill="var(--ow-edge)"/></marker></defs><style>
.orbweaver{font-family:var(--ow-font);font-size:var(--ow-font-size);background:var(--ow-canvas);color:var(--ow-text)}
.ow-canvas{fill:var(--ow-canvas)}
.ow-group-surface{fill:var(--ow-surface-muted);stroke:var(--ow-border);stroke-width:1;stroke-dasharray:5 5}
.ow-group-label-bg{fill:var(--ow-canvas)}
.ow-group-label{fill:var(--ow-text-muted);font-family:var(--ow-font-mono);font-size:10px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase}
.ow-edge-path{fill:none;stroke:var(--ow-edge);stroke-width:var(--ow-edge-width);stroke-linecap:round;stroke-linejoin:round}
.ow-edge{cursor:pointer}
.ow-edge[data-edge-type="error"] .ow-edge-path{stroke:var(--ow-danger)}
.ow-edge[data-edge-type="event"] .ow-edge-path{stroke-dasharray:5 5}
.ow-edge-label-bg{fill:var(--ow-canvas);stroke:var(--ow-border);stroke-width:1}
.ow-edge-label{fill:var(--ow-edge-label);font-size:11px;font-weight:600}
.ow-node{cursor:default;outline:none}
.ow-node-surface{fill:var(--ow-surface-raised);stroke:var(--ow-border-strong);stroke-width:1.25;filter:url(#ow-publishing-flow-shadow)}
.ow-node:hover .ow-node-surface{stroke:var(--ow-accent)}
.ow-node:focus-visible .ow-node-surface{stroke:var(--ow-focus);stroke-width:2.5}
.ow-node[data-selected] .ow-node-surface{stroke:var(--ow-selection);stroke-width:2.75}
.ow-edge[data-selected] .ow-edge-path{stroke:var(--ow-selection);stroke-width:3}
.ow-node[data-related] .ow-node-surface{stroke:var(--ow-accent)}
.ow-edge[data-related] .ow-edge-path{stroke:var(--ow-accent);stroke-width:2.25}
.ow-group[data-selected] .ow-group-surface{stroke:var(--ow-selection);stroke-width:2}
.ow-has-selection [data-muted]{opacity:.18}
.ow-node-accent{fill:var(--ow-accent)}
.ow-node-label{fill:var(--ow-text);font-weight:var(--ow-label-weight);text-anchor:middle;dominant-baseline:middle}
.ow-node-type{fill:var(--ow-text-muted);font-family:var(--ow-font-mono);font-size:9px;font-weight:600;letter-spacing:.9px;text-anchor:middle;text-transform:uppercase}
.ow-node[data-node-status="critical"] .ow-node-surface,.ow-node[data-node-status="error"] .ow-node-surface{stroke:var(--ow-danger)}
.ow-node[data-node-status="warning"] .ow-node-surface{stroke:var(--ow-warning)}
.ow-node[data-node-status="healthy"] .ow-node-surface{stroke:var(--ow-success)}
@media (prefers-reduced-motion:no-preference){.ow-node-surface,.ow-edge-path{transition:stroke .16s ease,opacity .16s ease}}
</style><rect class="ow-canvas" width="1226" height="120" rx="12"/><g class="ow-groups"></g><g class="ow-edges"><g class="ow-edge" data-edge-id="edge:source-&gt;validate:flow:0" data-edge-type="flow"><path class="ow-edge-path" d="M 207 60 L 289 60" marker-end="url(#ow-publishing-flow-arrow-end)"/></g><g class="ow-edge" data-edge-id="edge:validate-&gt;layout:flow:1" data-edge-type="flow"><path class="ow-edge-path" d="M 442 60 L 524 60" marker-end="url(#ow-publishing-flow-arrow-end)"/></g><g class="ow-edge" data-edge-id="edge:layout-&gt;render:flow:2" data-edge-type="flow"><path class="ow-edge-path" d="M 664 60 L 746 60" marker-end="url(#ow-publishing-flow-arrow-end)"/></g><g class="ow-edge" data-edge-id="edge:render-&gt;artifact:flow:3" data-edge-type="flow"><path class="ow-edge-path" d="M 899 60 L 981 60" marker-end="url(#ow-publishing-flow-arrow-end)"/></g></g><g class="ow-group-labels"></g><g class="ow-nodes" role="list"><g class="ow-node" transform="translate(32 32)" data-node-id="source" data-node-type="document" data-node-status="default" tabindex="0" role="listitem" aria-label="Declarative source."><path class="ow-node-surface" d="M 0 0 H 157 L 175 18 V 56 H 0 Z"/><path d="M 157 0 V 18 H 175" fill="none" stroke="var(--ow-border-strong)"/><text class="ow-node-label"><tspan x="87.5" y="23">Declarative source</tspan></text><text class="ow-node-type" x="87.5" y="46">document</text></g><g class="ow-node" transform="translate(289 32)" data-node-id="validate" data-node-type="process" data-node-status="default" tabindex="0" role="listitem" aria-label="Validate intent."><rect class="ow-node-surface" width="153" height="56" rx="var(--ow-node-radius)"/><rect class="ow-node-accent" x="0" y="12" width="3" height="32" rx="1.5"/><text class="ow-node-label"><tspan x="76.5" y="23">Validate intent</tspan></text><text class="ow-node-type" x="76.5" y="46">process</text></g><g class="ow-node" transform="translate(524 32)" data-node-id="layout" data-node-type="process" data-node-status="default" tabindex="0" role="listitem" aria-label="Derive layout."><rect class="ow-node-surface" width="140" height="56" rx="var(--ow-node-radius)"/><rect class="ow-node-accent" x="0" y="12" width="3" height="32" rx="1.5"/><text class="ow-node-label"><tspan x="70" y="23">Derive layout</tspan></text><text class="ow-node-type" x="70" y="46">process</text></g><g class="ow-node" transform="translate(746 32)" data-node-id="render" data-node-type="process" data-node-status="default" tabindex="0" role="listitem" aria-label="Render artifact."><rect class="ow-node-surface" width="153" height="56" rx="var(--ow-node-radius)"/><rect class="ow-node-accent" x="0" y="12" width="3" height="32" rx="1.5"/><text class="ow-node-label"><tspan x="76.5" y="23">Render artifact</tspan></text><text class="ow-node-type" x="76.5" y="46">process</text></g><g class="ow-node" transform="translate(981 32)" data-node-id="artifact" data-node-type="document" data-node-status="healthy" tabindex="0" role="listitem" aria-label="Self-contained artifact."><path class="ow-node-surface" d="M 0 0 H 195 L 213 18 V 56 H 0 Z"/><path d="M 195 0 V 18 H 213" fill="none" stroke="var(--ow-border-strong)"/><text class="ow-node-label"><tspan x="106.5" y="23">Self-contained artifact</tspan></text><text class="ow-node-type" x="106.5" y="46">document</text></g></g></svg>